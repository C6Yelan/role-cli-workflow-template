[project]
name = "example-project"
root = "/home/user/projects/example-project"
main_repo = "main"
workflow_dir = "shared_workspace/workflow"

[cli]
provider = "generic"
command = "my-cli-workflow-adapter"
model = "your-default-model"
reasoning_effort = "medium"
args = [
  "--role", "{role}",
  "--repo", "{repo}",
  "--model", "{model}",
  "--reasoning-effort", "{reasoning_effort}",
  "--instructions", "{role_instructions}",
  "--mcp-command", "{bridge_command}",
  "--mcp-cwd", "{bridge_cwd}",
  "--enabled-tools", "{enabled_tools}",
]
version_args = ["--version"]
login_check_args = []

# Additional arguments may be configured per role.
# [cli.roles.supervisor]
# model = "your-supervisor-model"
# reasoning_effort = "high"
# args = []

[git]
base_branch = "development"
role_branch_prefix = "workflow/"
feature_branch_pattern = "feature/*"
protected_branches = ["development", "main"]

[paths]
private = [".env", ".env.*", "private_docs/", "secrets/", "credentials/", "*.pem", "*.key"]

[commands]
test = ""
lint = ""
build = ""
format = ""
