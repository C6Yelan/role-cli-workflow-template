[project]
name = "example-project"
root = "/home/user/projects/example-project"
main_repo = "main"
workflow_dir = "shared_workspace/workflow"

[cli]
provider = "codex"
command = "codex"
args = []
version_args = ["--version"]
login_check_args = ["login", "status"]

# Optional defaults for every role.
# model = "your-model"
# reasoning_effort = "medium"

# Optional per-role overrides.
# [cli.roles.supervisor]
# model = "your-model"
# reasoning_effort = "medium"
# args = []

[git]
base_branch = "dev"
role_branch_prefix = "workflow/"
feature_branch_pattern = "feature/*"
protected_branches = ["dev", "main"]
integration_mode = "approved_transaction"

[paths]
private = [".env", ".env.*", "docs_local/", "private_docs/", "secrets/", "credentials/", "*.pem", "*.key", "*.crt", "*.cer"]

[commands]
test = ""
lint = ""
build = ""
format = ""
